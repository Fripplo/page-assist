name: Build Chrome extension (Ollama tool fix)
on:
  push:
    branches:
      - fix/ollama-final-tool-calls
  workflow_dispatch:

jobs:
  chrome-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run compile
      - name: Build Chrome extension
        run: bun run build:chrome
      - name: Package unpacked Chrome extension
        run: |
          test -f .output/chrome-mv3/manifest.json
          cd .output/chrome-mv3
          zip -r "$GITHUB_WORKSPACE/page-assist-chrome-ollama-fix.zip" .
      - name: Upload Chrome extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: page-assist-chrome-ollama-fix
          path: page-assist-chrome-ollama-fix.zip
          if-no-files-found: error
